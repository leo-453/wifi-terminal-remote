<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Terminal – MQTT Remoto</title>

    <!-- Libreria MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Script applicativi -->
    <script src="mqtt.js" defer></script>
    <script src="script.js" defer></script>

    <style>
        /* DNA estetico coerente con UI locale */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px;
            color: #333;
            line-height: 1.5;
            background-color: #fcfcfc;
        }

        #main {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; font-weight: 600; color: #111; border-bottom: 1px solid #000; padding-bottom: 10px; }
        h3 { margin-bottom: 10px; font-size: 18px; color: #111; }

        /* Stato Connessione */
        .status-bar {
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        #status { 
            color: #2a6bff; 
            border: 1px solid #000; 
            padding: 2px 8px; 
            border-radius: 6px; 
            background: #fff;
        }

        /* Selettori e input */
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #000;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 10px;
            background-color: #fff;
        }

        /* Input comando */
        #msg { background-color: #fffde7; }
        #msg:focus { background-color: #fff9c4; border-color: #2a6bff; outline: none; }

        /* Aree ricezione */
        #lastMessage, #messageLog {
            width: 100%;
            border: 1px solid #000;
            border-radius: 12px;
            padding: 12px;
            background: #e3f2fd; 
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        #messageLog { height: 250px; overflow-y: auto; white-space: pre-wrap; }
        #lastMessage { min-height: 60px; margin-top: 5px; }

        /* Bottoni */
        button { 
            padding: 10px 20px; 
            border-radius: 8px; 
            border: 1px solid #000; 
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            margin-bottom: 5px;
        }
        button:hover { background: #333; color: #fff; }
        button:active { transform: translateY(1px); }

        /* Sezioni */
        .section {
            background: #fff;
            border: 1px solid #000;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        /* Badge dispositivo selezionato */
        #selectedDevice {
            color: #2a6bff;
            font-weight: bold;
            background: rgba(42, 107, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Plotter */
        #plotterPanel {
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #plotterDragBar { background: #222; border-bottom: 1px solid #444; border-radius: 10px 100px 0 0; }

        /* Responsive */
        @media screen and (max-width: 600px) {
            body { padding: 10px; }
            button { width: 100%; padding: 15px; }
        }
    </style>
</head>

<body>

<div id="main">
    <h2>WiFi Terminal – MQTT Client</h2>

    <div class="status-bar">
        Stato Broker: <span id="status">disconnesso</span>
    </div>

    <!-- SEZIONE DISPOSITIVI -->
    <div class="section">
        <h3>Dispositivi rilevati</h3>
        <select id="deviceList" onchange="selezionaDispositivo()">
            <option value="">Scansionando rete MQTT...</option>
        </select>
        <p>Target: <span id="selectedDevice">nessuno</span></p>
    </div>

    <!-- SEZIONE INVIO -->
    <div class="section">
        <h3>📤 Trasmissione</h3>
        <input id="msg" type="text" placeholder="Scrivi un messaggio per il dispositivo...">
        <div style="display: flex; gap: 10px;">
            <button onclick="publishMessage()" style="flex: 2; background: #2a6bff; color: white;">INVIA</button>
            <button id="plotterToggle" style="flex: 1;">PLOTTER</button>
        </div>
    </div>

    <!-- SEZIONE RICEZIONE -->
    <div class="section" style="background: #f8f9fa;">
        <h3>📥 Ricezione</h3>
        <label>Ultimo dato:</label>
        <pre id="lastMessage"></pre>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label>Storico Log:</label>
            <button onclick="clearMessageLog()" style="padding: 5px 10px; font-size: 12px;">Pulisci</button>
        </div>
        <div id="messageLog"></div>
    </div>

</div>

<!-- PLOTTER -->
<div id="plotterPanel" style="display:none; position:absolute; top:150px; left:50px; width:600px; z-index:500; overflow:hidden;">
    <div id="plotterDragBar" style="cursor:move; height:30px;"></div>
    <canvas id="plotterCanvas" width="600" height="300"></canvas>
    <div id="plotterInfo" style="color:white; font-size:14px; padding:8px; background:#111; display:flex; justify-content:space-between; align-items:center;">
        <span id="plotterValues"></span>
        <div style="display:flex; gap:5px;">
            <button id="plotterRunStop" style="background:#333; color:white;">STOP</button>
            <button id="plotterFS" style="background:#333; color:white;">FS</button>
            <span id="plotterFSControl" style="display:none;">
                <input id="plotterMaxInput" type="number" style="width:60px; margin:0 5px; padding:2px;">
                <button id="plotterSetMax" style="background:#333; color:white; padding:2px 5px;">Set</button>
            </span>
            <button id="plotterRecord" style="background:#333; color:white;">REC</button>
        </div>
    </div>
</div>

<script>
function addMessage(msg) {
    const out = document.getElementById("messageLog");
    out.textContent += msg + "\n";
    out.scrollTop = out.scrollHeight;
}

function clearMessageLog() {
    document.getElementById("messageLog").textContent = "";
}
</script>

</body>
</html>
