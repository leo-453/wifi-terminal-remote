<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WiFi_Terminal Remoto</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/mqttws31.min.js"></script>
</head>
<body>
  <h2>Stato connessione: <span id="status">disconnesso</span></h2>

  <script>
    const broker = "test.mosquitto.org";
    const port = 8081;

    let client = new Paho.MQTT.Client(broker, port, "webclient_" + Math.random());

    client.onConnectionLost = () => {
      document.getElementById("status").innerText = "disconnesso";
    };

    client.connect({
      onSuccess: () => {
        document.getElementById("status").innerText = "connesso";
      },
      onFailure: () => {
        document.getElementById("status").innerText = "errore";
      },
      useSSL: true
    });
  </script>
</body>
</html>
