<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Terminal Remote</title>

    <link rel="stylesheet" href="style.css">

   <script src="https://unpkg.com/mqtt/dist/mqtt.min.js" defer></script>
<script src="mqtt2.js" defer></script>
<script src="script.js" defer></script>

</head>

<body>

<div id="main">
    <h2>WiFi Terminal</h2>

    <!-- ⭐ Barra stato minimalista -->
    <div class="status-bar">
        Stato MQTT: <span id="status">disconnesso</span>
        <span id="mqttDot" class="dot dot-red"></span>
    </div>

    <!-- DISPOSITIVI -->
<div class="section">
    <h3>Dispositivi</h3>

    <!-- Versione ibrida: placeholder iniziale -->
    <select id="deviceList" onchange="selezionaDispositivo()">
        <option value="">Scansione rete MQTT...</option>
    </select>

    <!-- Target chiaro e semantico -->
    <p>Target: <span id="selectedDevice">nessuno</span></p>
</div>


    <!-- TRASMISSIONE E COMANDI -->
    <div class="section">
        <h3>📤 Trasmissione e Comandi</h3>
        <input id="msg" type="text" placeholder="Scrivi qui...">

        <div class="transmit-buttons">
            <button onclick="publishMessage()">SEND</button>
            <button onclick="document.getElementById('msg').value=''">CLEAR</button>
            <button id="plotterToggle">PLOTTER</button>
           
            <!-- ⭐ Nuovo pulsante IMPORT PARAM -->
           
            <button id="btnMqttParam">MQTT PARAM</button>

        </div>

    </div>

    <!-- RICEZIONE -->
    <div class="section ricezione" style="background:#f8f9fa;">
        <h3>📥 Ricezione</h3>
        <div class="rx-controls">
            <button onclick="clearMessageLog()">Pulisci</button>
        </div>

        <div id="messageLog"></div>
    </div>

</div>

<!-- PLOTTER -->
<div id="plotterPanel" style="display:none;">
    <div id="plotterDragBar"></div>

    <div id="plotterCanvasWrapper">
        <canvas id="plotterCanvas" width="600" height="300"></canvas>
    </div>

    <div id="plotterInfo">
        <span id="plotterValues"></span>

        <div id="plotterButtons">
            <button id="plotterRunStop">STOP</button>
            <button id="plotterFS">FS</button>

            <span id="plotterFSControl">
                <span>FS:</span>
                <input id="plotterMaxInput" type="number">
                <button id="plotterSetMax">Set</button>
            </span>

            <button id="plotterRecord">REC</button>
        </div>
    </div>
</div>

<!-- ===============================
     MODAL PARAMETRI MQTT
=============================== -->
<div id="mqttModal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Parametri MQTT</h3>

        <label>Broker</label>
        <input id="mqttBrokerInput" type="text">

        <label>Porta</label>
        <input id="mqttPortInput" type="number">

        <label>User</label>
        <input id="mqttUserInput" type="text">

        <label>Password</label>
        <input id="mqttPassInput" type="text">

        <div style="margin-top:15px; display:flex; gap:10px;">
            <button id="mqttSaveBtn">Salva</button>
            <button id="mqttCloseBtn">Chiudi</button>
        </div>
    </div>
</div>
    
<div id="helpHintRemote"
     style="position:fixed; bottom:8px; right:12px;
            font-size:12px; color:#888; opacity:0.7;
            z-index:9999; pointer-events:none;">
    F1 for Help
</div>

</body>
</html>
